<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HID Liveness Kiosk</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <span class="logo">HID</span><h1>Access kiosk</h1>
    <nav><a href="/" class="active">Kiosk</a><a href="/enroll.html">Enroll</a><a href="/policy.html">Policy</a><a href="/audit.html">Audit</a><a href="/record.html">Record</a><a href="/report.html">Results</a></nav>
  </header>

  <div class="contextbar">
    <label class="inline">Zone <select id="zone"></select></label>
    <label class="inline">Time
      <input type="datetime-local" id="at" />
      <span class="check"><input type="checkbox" id="liveTime" checked /> live</span>
    </label>
    <span class="spacer"></span>
    <span class="net on" id="netStatus"><i></i>Checking connection</span>
    <button class="secondary small-btn" id="simulate">Simulate network loss</button>
  </div>

  <main class="grid">
    <section class="stack">
      <div class="cam" id="cam">
        <video id="video" playsinline muted></video>
        <div class="guide"></div>
        <div class="instruction" id="instruction"></div>
        <div class="banner" id="banner">Starting camera</div>
        <div class="progress" id="progress"></div>
      </div>
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <button id="start">Start check<kbd>Space</kbd></button>
          <button class="secondary" id="toggleDebug">Signals</button>
        </div>
        <label class="inline">Badge
          <select id="claimed"><option value="">None, search by face</option></select>
        </label>
      </div>
    </section>

    <section class="stack">
      <div class="decision idle" id="decision">
        <div class="eyebrow">Decision</div>
        <div class="big">Ready</div>
        <p class="why">Look at the camera and press Start.</p>
      </div>

      <div class="card otp hidden" id="otpCard">
        <h2>Second factor</h2>
        <form id="otpForm" class="stack">
          <p class="small muted" id="otpSent" style="margin:0"></p>
          <input id="otpCode" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="000000" aria-label="Verification code" />
          <button type="submit">Verify code</button>
        </form>
      </div>

      <div class="card hidden" id="phoneCard">
        <h2>Demo device · SMS</h2>
        <div class="phone" id="phone"><span class="muted small">No messages</span></div>
      </div>
    </section>
  </main>

  <section class="wide hidden" id="debugCard">
    <div class="card">
      <h2>Signals behind this decision</h2>
      <div id="debug" class="muted small">Run a check to see each signal.</div>
    </div>
  </section>
  <script type="module" src="kiosk.js"></script>
</body>
</html>
